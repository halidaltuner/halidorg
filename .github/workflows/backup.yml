name: backup

# Nightly SQL dump of each env's main D1 database into its backups bucket
# (Phase 9.1, docs/runbook-restore.md). The weekly Markdown/JSON export is
# the app's export.weekly job (Worker cron), into the same bucket.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging, prod]
    environment: ${{ matrix.env }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: sh ../scripts/backup-bucket.sh ${{ matrix.env }}
      - run: sh ../scripts/backup-d1.sh ${{ matrix.env }}
