name: deploy

# main deploys staging. Prod is deployed only by hand (Actions → deploy →
# Run workflow → prod): halid.org shows "coming soon" until the project is
# done, and v* tags are milestones, not releases.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && inputs.env == 'prod') && 'prod' || 'staging' }}
    # One deploy per env at a time; a queued one waits rather than cancelling a
    # half-applied migration.
    concurrency:
      group: deploy-${{ (github.event_name == 'workflow_dispatch' && inputs.env == 'prod') && 'prod' || 'staging' }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_ENV: ${{ (github.event_name == 'workflow_dispatch' && inputs.env == 'prod') && 'prod' || 'staging' }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      # Migrations first: the new container expects the new schema. They must
      # stay backward compatible, since the old container serves until deploy ends.
      - run: npx wrangler d1 migrations apply DB --remote --env "$WRANGLER_ENV" -c ../wrangler.jsonc
      # Search index database (ADR-010); derived data, rebuildable from DB.
      - run: npx wrangler d1 migrations apply SEARCH --remote --env "$WRANGLER_ENV" -c ../wrangler.jsonc
      # The BACKUPS binding needs its bucket before the deploy (Phase 9.1);
      # it already exists for staging and prod, so a token without R2 rights
      # only skips the lifecycle rules here (the nightly backup reports it).
      - name: Backups bucket
        continue-on-error: true
        run: sh ../scripts/backup-bucket.sh "$WRANGLER_ENV"
      # The image names its own commit (Dockerfile, ui.DeploySHA).
      - run: echo "$GITHUB_SHA" > ../app/BUILD_SHA
      # Docker on the runner builds the container image; wrangler pushes it.
      - run: npx wrangler deploy --env "$WRANGLER_ENV" -c ../wrangler.jsonc --var "DEPLOY_SHA:$GITHUB_SHA"
      # Pages in KV from the previous deploy are served stale and re-rendered
      # in the background; touching each one now refreshes them all.
      - name: Refresh edge pages
        continue-on-error: true
        env:
          ORIGIN: ${{ (github.event_name == 'workflow_dispatch' && inputs.env == 'prod') && 'https://halid.org' || 'https://staging.halid.org' }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: sh ../scripts/refresh-edge.sh
