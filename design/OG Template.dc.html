<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0B1220}</style>
</helmet>
<div style="width:1200px;height:630px;box-sizing:border-box;background:#0B1220;color:#E6EBF2;padding:72px 80px;display:flex;flex-direction:column;font-family:'IBM Plex Sans',system-ui,sans-serif;position:relative;overflow:hidden">
  <div style="position:absolute;inset:0;background-image:linear-gradient(#17223A 1px,transparent 1px),linear-gradient(90deg,#17223A 1px,transparent 1px);background-size:48px 48px;opacity:.5"></div>
  <div style="position:relative;display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono',monospace;font-size:26px;color:#8D98AB">
    <span style="width:14px;height:14px;border-radius:50%;background:{{ dot }}"></span>
    <span>{{ kind }}</span><span>·</span><span>{{ date }}</span>
  </div>
  <h1 style="position:relative;margin:auto 0;font-size:76px;line-height:1.08;font-weight:600;letter-spacing:-0.025em;max-width:960px;text-wrap:balance">{{ title }}</h1>
  <div style="position:relative;display:flex;justify-content:space-between;align-items:flex-end">
    <span style="font-family:'JetBrains Mono',monospace;font-weight:700;font-size:44px;letter-spacing:-0.02em;color:#E6EBF2;text-shadow:-3px 0 rgba(251,113,133,.75),3px 0 rgba(34,211,238,.75)">halid<span style="color:#FB7185;text-shadow:none">.</span></span>
    <span style="font-family:'JetBrains Mono',monospace;font-size:24px;color:#8D98AB">{{ meta }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;1200px&quot;,&quot;height&quot;:&quot;630px&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Notes on an htmx-first admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;post&quot;,&quot;note&quot;,&quot;snippet&quot;,&quot;link&quot;,&quot;fav&quot;,&quot;project&quot;],&quot;default&quot;:&quot;post&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-10-16&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;halid.org · 12 min&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const KC = { post:'#22D3EE', note:'#A5B4FC', snippet:'#FBBF24', link:'#8D98AB', fav:'#FB7185', project:'#4ADE80' };
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind ?? 'post';
    return { kind, dot: KC[kind] || KC.post, title: this.props.title ?? 'Notes on an htmx-first admin', date: this.props.date ?? '2026-10-16', meta: this.props.meta ?? 'halid.org · 12 min' };
  }
}
</script>
</body>
</html>
