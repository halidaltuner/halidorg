<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F7F8FA}a{color:#0E7490}a:hover{color:#0891B2}:focus-visible{outline:2px solid #0891B2;outline-offset:2px}@media (prefers-reduced-motion:reduce){*{transition:none!important}}</style>
</helmet>
<div style="min-height:100vh;background:#F7F8FA;color:#0E1525;font-family:'IBM Plex Sans',system-ui,sans-serif">
  <dc-import name="Header" active="" hint-size="100%,66px"></dc-import>
  <main style="max-width:1100px;margin:0 auto;padding:64px 24px 0;display:flex;flex-direction:column;gap:32px">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap">
      <div style="display:flex;flex-direction:column;gap:8px">
        <h1 style="margin:0;font-size:36px;line-height:1.2;font-weight:600;letter-spacing:-0.02em">favs</h1>
        <p style="margin:0;font-size:16px;color:#5A6578">Books, tools and records I keep coming back to.</p>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="5">
          <button onClick="{{ c.pick }}" style="font-family:'JetBrains Mono',monospace;font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.color }}">{{ c.label }}</button>
        </sc-for>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px">
      <sc-for list="{{ items }}" as="f" hint-placeholder-count="8">
        <div style="display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #DCE1E8;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(14,21,37,.04)">
          <div style="aspect-ratio:4/3;background:repeating-linear-gradient(135deg,#EEF1F5 0 8px,#F7F8FA 8px 16px);display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:12px;color:#5A6578;border-bottom:1px solid #DCE1E8">{{ f.ph }}</div>
          <div style="padding:16px;display:flex;flex-direction:column;gap:6px">
            <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#5A6578;display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:#E11D48"></span>{{ f.type }}</div>
            <div style="font-size:16px;font-weight:500;line-height:1.4">{{ f.title }}</div>
            <div style="font-size:14px;color:#5A6578">{{ f.by }}</div>
            <div style="display:flex;gap:3px;margin-top:4px" aria-label="{{ f.ratingLabel }}">
              <sc-for list="{{ f.sq }}" as="s" hint-placeholder-count="5">
                <span style="width:10px;height:10px;border-radius:2px;background:{{ s.c }};border:1px solid #0E1525"></span>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </main>
  <dc-import name="Footer" hint-size="100%,180px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const FAVS = [
  ['book','Designing Data-Intensive Applications','Martin Kleppmann',5],
  ['book','A Philosophy of Software Design','John Ousterhout',4],
  ['tool','Helix','modal editor',4],
  ['tool','pgcli','postgres client',5],
  ['record','Kind of Blue','Miles Davis',5],
  ['record','Selected Ambient Works 85–92','Aphex Twin',4],
  ['film','Stalker','Andrei Tarkovsky',5],
  ['book','The Mythical Man-Month','Fred Brooks',3]
];
class Component extends DCLogic {
  state = { type:'all' };
  renderVals() {
    const { type } = this.state;
    return {
      chips: ['all','book','tool','record','film'].map(k => ({ label:k, pick: () => this.setState({ type:k }), bg: k===type?'#0E1525':'#FFFFFF', color: k===type?'#FFFFFF':'#5A6578', border: k===type?'#0E1525':'#DCE1E8' })),
      items: FAVS.filter(f => type==='all' || f[0]===type).map(([t,title,by,r]) => ({ type:t, title, by, ph: t + ' cover', ratingLabel: r + ' of 5',
        sq: [0,1,2,3,4].map(i => ({ c: i < r ? '#0E1525' : 'transparent' })) }))
    };
  }
}
</script>
</body>
</html>
