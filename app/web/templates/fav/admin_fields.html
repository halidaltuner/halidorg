{{define "entry-fields"}}
<fieldset class="ent-langs ent-types"><legend>{{tr .Lang "favs.filter"}}</legend>
{{- range .Options.Types}}<label class="check"><input type="radio" name="fav_type" value="{{.Value}}"{{if .On}} checked{{end}}>{{.Label}}</label>{{end}}
</fieldset>
<label>{{tr .Lang "kind.fav.author"}}<input name="author" value="{{.Item.Author}}"></label>
<label>url<input name="url" value="{{.Item.URL}}" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://"></label>
<fieldset class="ent-langs"><legend>{{tr .Lang "kind.fav.rating"}}</legend>
{{- range .Options.Ratings}}<label class="check"><input type="radio" name="rating" value="{{.Value}}"{{if .On}} checked{{end}}>{{.Label}}</label>{{end}}
</fieldset>
<label>{{tr .Lang "entry.category"}}<select name="category">{{range .Options.Categories}}<option value="{{.Value}}"{{if .On}} selected{{end}}>{{.Label}}</option>{{end}}</select></label>
{{end}}
